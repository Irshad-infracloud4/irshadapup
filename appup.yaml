apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Irshad-infracloud4/irshadapup
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - redis-values.yaml
    chart: redis
    repoURL: https://charts.bitnami.com/bitnami
    
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
