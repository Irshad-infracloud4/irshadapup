replicaCount: 6  # Set replicas for both blue and green deployments

# Define Blue Deployment (current version)
blue:
  image:
    repository: redis
    pullPolicy: IfNotPresent
    tag: "6.2.6"  # Example version for Blue deployment
  service:
    type: ClusterIP
    port: 6379
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

# Define Green Deployment (new version)
green:
  image:
    repository: redis
    pullPolicy: IfNotPresent
    tag: "7.0.0"  # Example version for Green deployment
  service:
    type: ClusterIP
    port: 6379
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Set common values for Redis
image:
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
