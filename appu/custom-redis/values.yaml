# Default values for custom-redis.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 6  # Set replicas to 6 for high availability

image:
  repository: redis  # Corrected image repository to Redis
  pullPolicy: IfNotPresent
  tag: "7.0.0"  # Example Redis version (you can specify the version you want)

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 6379  # Redis default port

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
  # Uncomment and modify resource requests and limits as necessary
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

# Rolling update settings to ensure zero-downtime upgrade
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1  # Allows one pod to be unavailable during update, reducing the chance of downtime
